apiVersion: apps/v1
kind: Deployment
metadata:
  name: daffigard-devine-billys
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daffigard-devine-billys
  template:
    metadata:
      labels:
        app: daffigard-devine-billys
    spec:
      # imagePullSecrets:
      #   - name: ghcr-secret
      containers:
      - name: daffigard-devine-billys
        image: ghcr.io/hampusmattsson1/daffigard:0.1.2-devine
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: "2Gi"
            cpu: "1"
        env:
          - name: INSTANCE_COUNT
            value: "2"
          - name: LOW_RESOURCE
            value: "false"
          - name: PROFILE
            value: "devine-billys"
          - name: VARIANT
            value: "billys"