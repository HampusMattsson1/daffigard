# Global default container settings
image:
  repository: ghcr.io/hampusmattsson1/daffigard
  tag: 0.2.0-total
  pullPolicy: IfNotPresent

instanceCount: "2"

resources:
  requests:
    memory: "500Mi"
    cpu: "300m"
  limits:
    memory: "1Gi"
    cpu: "750m"

persistence:
  enabled: false  # Set to true to enable PVC mount
  claimName: daffigard-pvc
  mountPath: /data

# List of game automation instances
instances:
  - name: hampus
    profile: "hampus"

  - name: sharif
    profile: "sharif"

  - name: hampus-billys
    profile: "hampus-billys"
    variant: "billys"

  - name: sharif-billys
    profile: "sharif-billys"
    variant: "billys"

  - name: jonas
    profile: "jonas"

  - name: jonas-billys
    profile: "jonas-billys"
    variant: "billys"

  - name: robin-billys
    profile: "robin-billys"
    variant: "billys"

  - name: devine-billys
    profile: "devine-billys"
    variant: "billys"

  - name: simon
    profile: "simon"

  - name: simon-billys
    profile: "simon-billys"
    variant: "billys"

  - name: erik
    profile: "erik"

  - name: erik-billys
    profile: "erik-billys"
    variant: "billys"
