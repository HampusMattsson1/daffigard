image:
  repository: ghcr.io/hampusmattsson1/daffigard
  tag: 0.2.0-unlocked
  pullPolicy: IfNotPresent

instanceCount: "2"

# Default schedule if not overridden per instance (e.g., every hour)
defaultSchedule: "0 6 * * *"

# Resource requests and limits
resources:
  requests:
    memory: "500Mi"
    cpu: "400m"
  limits:
    memory: "1Gi"
    cpu: "900m"

# Storage configuration
persistence:
  enabled: false
  mountPath: "/data"
  claimName: "daffigard-shared-pvc"

# List of instances to deploy as separate CronJobs
instances:
  - name: hampus
    profile: "hampus"

  - name: sharif
    profile: "sharif"

  - name: hampus-billys
    profile: "hampus-billys"
    variant: "billys"

  - name: sharif-billys
    profile: "sharif-billys"
    variant: "billys"

  - name: jonas
    profile: "jonas"

  - name: jonas-billys
    profile: "jonas-billys"
    variant: "billys"

  - name: robin-billys
    profile: "robin-billys"
    variant: "billys"

  - name: devine-billys
    profile: "devine-billys"
    variant: "billys"

  - name: simon
    profile: "simon"

  - name: simon-billys
    profile: "simon-billys"
    variant: "billys"

  - name: erik
    profile: "erik"

  - name: erik-billys
    profile: "erik-billys"
    variant: "billys"