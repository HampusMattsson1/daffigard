apiVersion: apps/v1
kind: Deployment
metadata:
  name: daffigard-hampus-billys
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daffigard-hampus-billys
  template:
    metadata:
      labels:
        app: daffigard-hampus-billys
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: daffigard-hampus-billys
        image: ghcr.io/hampus-mattsson_rbl/daffigard:0.1.1
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: "2Gi"
            cpu: "1"
        env:
          - name: INSTANCE_COUNT
            value: "2"
          - name: LOW_RESOURCE
            value: "false"
          - name: PROFILE
            value: "hampus-billys"
          - name: VARIANT
            value: "billys"

